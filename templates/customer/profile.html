{% extends 'base.html' %}{% from '_macros.html' import head %}
{% block title %}Profile{% endblock %}
{% block content %}
{{ head('My profile', 'Keep your contact details up to date so mechanics can reach you.') }}
<div class="row g-4">
  <div class="col-lg-7"><div class="rs-card"><div class="rs-card-h">Personal details</div><div class="rs-card-b">
    <form method="post" class="row g-3">
      <div class="col-md-6"><label class="form-label">Full name</label><input name="full_name" class="form-control" value="{{ me.full_name }}" required></div>
      <div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control" value="{{ me.phone }}" required></div>
      <div class="col-12"><label class="form-label">Email (cannot be changed)</label><input class="form-control" value="{{ me.email }}" disabled></div>
      <div class="col-md-8"><label class="form-label">Address</label><input name="address" class="form-control" value="{{ me.address or '' }}"></div>
      <div class="col-md-4"><label class="form-label">City</label><input name="city" class="form-control" value="{{ me.city or '' }}"></div>
      <div class="col-12"><button class="btn btn-primary">Save changes</button></div>
    </form></div></div></div>
  <div class="col-lg-5"><div class="rs-card"><div class="rs-card-h">Change password</div><div class="rs-card-b">
    <form method="post" class="vstack gap-3"><input type="hidden" name="action" value="password">
      <input type="password" name="current" class="form-control" placeholder="Current password" required>
      <input type="password" name="new" class="form-control" placeholder="New password (6+ characters)" minlength="6" required>
      <input type="password" name="confirm" class="form-control" placeholder="Confirm new password" required>
      <button class="btn btn-outline-primary">Update password</button>
    </form></div></div></div>
</div>
{% endblock %}
